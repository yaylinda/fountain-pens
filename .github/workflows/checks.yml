name: Application checks

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test scripts/deployment/verify-config.test.mjs
      - run: npm run lint
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run test:migration
      - run: npm run test:db

  deploy:
    name: Deploy production
    needs: [check, database]
    # Set this repository variable only after completing docs/deployment.md.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Validate deployment configuration
        run: |
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID'; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@62.2.0
      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN'; exit 1; }
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Verify linked project and public backend configuration
        run: node --env-file=.vercel/.env.production.local scripts/deployment/verify-config.mjs
      - name: Install locked application dependencies
        run: npm ci
      - name: Build production output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Reject an obsolete main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_sha" = "$GITHUB_SHA" || { echo 'Main advanced; deploy the newer checked commit.'; exit 1; }
      - name: Deploy checked output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --meta githubCommitSha="$GITHUB_SHA" > "$RUNNER_TEMP/vercel-url.txt"
          printf 'Production commit: `%s`\n\nDeployment: %s\n' "$GITHUB_SHA" "$(cat "$RUNNER_TEMP/vercel-url.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove downloaded environment and build output
        if: always()
        run: rm -rf .vercel
