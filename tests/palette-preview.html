<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Desk palette — synthetic preview</title></head><body><div id="root"></div><script type="module">
// Local visual fixture: no hosted requests, passwords, or collection writes.
if (import.meta.env.VITE_SUPABASE_URL !== 'https://synthetic.supabase.co' || import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY !== 'sb_publishable_synthetic') throw new Error('Use the synthetic preview environment described in docs/auth-ui.md.');
const options = new URLSearchParams(location.search);
let signedIn = options.get('mode') !== 'public';
let palette = JSON.parse(sessionStorage.getItem('synthetic-palette') || '[]');
const inkNames = ['Ancient Copper', 'Honey Burst', 'Chiku-rin', 'Syo-ro', 'Kon-peki', 'Yama-budo'];
const colors = ['#A45532','#C4A348','#80A348','#287D7D','#2574AA','#792D53'];
const inks = inkNames.map((name,i)=>({id:'i'+i,brand:i<2?'Diamine':'Pilot',collection:i<2?'':'Iroshizuku',name,colorHex:colors[i],favorite:false,archived:false}));
const pens = inkNames.map((_,i)=>({id:'p'+i,brand:i%2?'Pilot':'Lamy',model:i%2?'Custom 823':'Safari',color:['Amber','Ivory','Forest','Ocean','Blue','Burgundy'][i],nibSize:'Medium',nibType:'Gold',favorite:false,archived:false,needsRefill:i===2}));
const events = pens.map((p,i)=>({id:'e'+i,sequence:String(i+1),penId:p.id,date:'2026-10-01',kind:'refill',inkIds:i===5?['i0','i5']:['i'+i],notes:'Synthetic writing sample',notPure:i===5}));
const nativeFetch = window.fetch.bind(window);
window.fetch = async (input, init) => {
  const url = String(input);
  if (!url.startsWith('https://synthetic.supabase.co')) return nativeFetch(input, init);
  if (url.includes('/auth/v1/token')) {
    await new Promise(resolve => setTimeout(resolve, 600));
    const {email} = JSON.parse(init.body);
    if (email.startsWith('fail')) return Response.json({msg:'Synthetic failure',error_code:'invalid_credentials'},{status:400});
    signedIn = true; sessionStorage.setItem('synthetic-owner', 'true');
    const id = '00000000-0000-4000-8000-000000000001';
    const token = btoa(JSON.stringify({alg:'HS256'}))+'.'+btoa(JSON.stringify({sub:id,exp:Math.floor(Date.now()/1000)+3600}))+'.synthetic';
    return Response.json({access_token:token,refresh_token:'synthetic',expires_in:3600,token_type:'bearer',user:{id,email,aud:'authenticated',app_metadata:{},user_metadata:{}}});
  }
  if (url.includes('/auth/v1/logout')) { signedIn=false; sessionStorage.removeItem('synthetic-owner'); return new Response(null,{status:204}); }
  if (url.includes('/rest/v1/rpc/save_desk_palette')) {
    if (!signedIn) return Response.json({code:'42501'},{status:403});
    if (sessionStorage.getItem('synthetic-fail')==='true') return Response.json({code:'offline'},{status:503});
    palette = JSON.parse(init.body).p_items;
    sessionStorage.setItem('synthetic-palette', JSON.stringify(palette));
    return Response.json({items:palette});
  }
  if (url.includes('/rest/v1/rpc/get_collection')) return Response.json({pens,inks,events:options.has('empty')?[]:events,palette,canEdit:signedIn,asOf:'2026-10-03'});
  throw new Error('Unsupported synthetic request');
};
await import('/src/main.tsx');
</script></body></html>
