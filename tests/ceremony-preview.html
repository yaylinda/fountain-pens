<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ink ceremony rehearsal</title><style>body{background:#f5f1e9;color:#263f38;font:18px Georgia;margin:40px}button{background:#263f38;color:#fff6dc;padding:14px;border:1px solid #b88d49;border-radius:8px;margin:6px}p{max-width:550px}footer{position:fixed;bottom:25px;right:25px}</style></head><body><h1>Ink & nib · Ceremony rehearsal</h1><p>Local artwork preview. These controls never read or write inventory and never call a save API.</p><button id="play">Replay save ceremony</button><button id="reduced">Reduced motion</button><button id="sign">Signature</button><button id="stamp">Stamp impact</button><button id="burn">Burn</button><button id="gold">Gold ink</button><button id="swirl">Swirl</button><footer><button id="save">Save changes</button></footer><script type="module">
import {playInkCeremony} from '/src/lib/inkCeremony.ts';
let stop; const nativeMedia=window.matchMedia.bind(window); const nativeRAF=window.requestAnimationFrame.bind(window);
function run(time){stop?.();window.matchMedia=time===-1?()=>({matches:true,addEventListener(){},removeEventListener(){}}):nativeMedia;const start=performance.now();window.requestAnimationFrame=time==null?nativeRAF:cb=>nativeRAF(()=>cb(start+time));stop=playInkCeremony({x:innerWidth-100,y:innerHeight-50});}
for(const [id,time] of [['reduced',-1],['play',null],['save',null],['sign',1400],['stamp',2790],['burn',3550],['gold',3880],['swirl',4400]])document.getElementById(id).onclick=()=>run(time);
</script></body></html>
